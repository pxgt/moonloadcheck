name: Deployment analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - name: Install reference compilers
        timeout-minutes: 6
        run: |
          # The Azure mirror stalled package transfers on two fresh runners.
          # Keep the runner's signed Ubuntu archive/security fallbacks.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Install hash-pinned MoonBit and reference loader tools
        run: |
          python3 tools/bootstrap_moon.py
          echo "$GITHUB_WORKSPACE/.tools/moon-0.10.16/bin" >> "$GITHUB_PATH"
          python3 tools/oracle/bootstrap_reference.py
      - name: Build fixtures and compare real loaders
        run: |
          python3 tools/oracle/build_fixtures.py
          python3 tools/oracle/build_u1_snapshots.py
          python3 tools/oracle/build_cache_fixtures.py
          python3 tools/oracle/build_u2_snapshots.py
          python3 tools/oracle/build_u3_snapshots.py
          python3 tools/oracle/build_token_fixtures.py
          python3 tools/oracle/build_symbol_fixtures.py
          python3 tools/oracle/probe_paths.py
          python3 tools/corpus/build_roots.py
          python3 tools/corpus/build_version_fallback.py
          python3 tools/corpus/build_copy.py
          python3 tools/corpus/build_paths.py
          python3 tools/corpus/build_inputs.py
          python3 tools/corpus/build_limits.py
          python3 tools/corpus/build_linkage_edges.py
          python3 tools/corpus/build_parser_edges.py
          python3 tools/corpus/build_environment_edges.py
          python3 tools/corpus/build_profile_facts.py
          python3 tools/corpus/build_glibcxx.py
          python3 tools/corpus/build_bindings.py
          python3 tools/corpus/build_stress.py
      - name: Check, build and test native and JS
        run: |
          moon update
          moon check --target js,native --deny-warn
          moon build --target js,native
          moon test --target js,native
          python3 tools/check_vendor.py
          python3 tools/verify_cli.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/verify_cli_contract.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/verify.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/self_host.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/verify_copy.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/measure.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/verify_copy_mutations.py
          python3 tools/corpus/verify_paths.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/verify_linkage_edges.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/verify_environment_edges.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/verify_maturity.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe --measure
          python3 tools/verify_acceptance_mutations.py
          python3 tools/verify_consumer.py --target js,native
      - name: Verify target identities and independent x86-64/AArch64 FFI deployments
        run: |
          python3 tools/verify_targets.py
          python3 tools/verify_deployment.py --native _build/native/debug/build/cmd/main/main.exe --js _build/js/debug/build/cmd/main/main.js
      - name: Verify offline HTML, diagnostic guidance and CI summaries
        run: python3 tools/verify_reports.py --native _build/native/debug/build/cmd/main/main.exe --js _build/js/debug/build/cmd/main/main.js
      - name: Verify public interfaces and first-party formatting
        run: |
          moon info
          moon fmt --check . analysis snapshot model internal/cache internal/elf_adapter internal/presentation experiments/parser_probe experiments/segment_probe cmd/main cmd/probe
          git diff --exit-code
  walkthrough:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - name: Install documented prerequisites
        timeout-minutes: 6
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y python3 git build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Execute README from a fresh checkout
        run: python3 tools/verify_walkthrough.py --require-clean
      - name: Audit and consume the packaged archive
        run: |
          export PATH="$PWD/.tools/moon-0.10.16/bin:$PATH"
          moon package --frozen
          python3 tools/verify_archive.py --target js,native
      - name: Consume both immutable Mooncakes releases
        run: |
          export PATH="$PWD/.tools/moon-0.10.16/bin:$PATH"
          python3 tools/verify_registry.py --version 0.1.0 --target js,native
          python3 tools/verify_registry.py --version 0.2.0 --target js,native
