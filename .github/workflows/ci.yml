name: Deployment analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - name: Install reference compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Install hash-pinned MoonBit and reference loader tools
        run: |
          python3 tools/bootstrap_moon.py
          echo "$GITHUB_WORKSPACE/.tools/moon-0.10.16/bin" >> "$GITHUB_PATH"
          python3 tools/oracle/bootstrap_reference.py
      - name: Build fixtures and compare real loaders
        run: |
          python3 tools/oracle/build_fixtures.py
          python3 tools/oracle/build_u1_snapshots.py
          python3 tools/oracle/build_cache_fixtures.py
          python3 tools/oracle/build_u2_snapshots.py
          python3 tools/oracle/build_u3_snapshots.py
          python3 tools/oracle/build_token_fixtures.py
          python3 tools/oracle/build_symbol_fixtures.py
          python3 tools/oracle/probe_paths.py
          python3 tools/corpus/build_roots.py
          python3 tools/corpus/build_version_fallback.py
          python3 tools/corpus/build_copy.py
          python3 tools/corpus/build_paths.py
          python3 tools/corpus/build_inputs.py
          python3 tools/corpus/build_limits.py
          python3 tools/corpus/build_linkage_edges.py
          python3 tools/corpus/build_parser_edges.py
      - name: Check, build and test native and JS
        run: |
          moon update
          moon check --target js,native --deny-warn
          moon build --target js,native
          moon test --target js,native
          python3 tools/check_vendor.py
          python3 tools/verify_cli.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/verify.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/self_host.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/verify_copy.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/measure.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/verify_copy_mutations.py
          python3 tools/corpus/verify_paths.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/corpus/verify_linkage_edges.py --js _build/js/debug/build/cmd/main/main.js --native _build/native/debug/build/cmd/main/main.exe
          python3 tools/verify_acceptance_mutations.py
          python3 tools/verify_consumer.py
      - name: Verify public interfaces and first-party formatting
        run: |
          moon info
          moon fmt --check . analysis snapshot model internal/cache internal/elf_adapter experiments/parser_probe experiments/segment_probe cmd/main cmd/probe
          git diff --exit-code
